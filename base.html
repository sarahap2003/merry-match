<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#174d42"><title>{{ event.title if event is defined else 'Merry Match' }} · Secret Santa</title><link rel="stylesheet" href="/static/style.css"></head><body><header><a href="/" class="brand">✦ Merry Match <small>SECRET SANTA</small></a><span>Make giving magical ✨</span></header><main>{% with msgs=get_flashed_messages() %}{% if msgs %}<div class="notice">{% for m in msgs %}<p>{{m}}</p>{% endfor %}</div>{% endif %}{% endwith %}{% block content %}{% endblock %}</main><footer>Made for a little holiday magic · Keep your private links safe</footer><script>function copyText(id){const el=document.getElementById(id);navigator.clipboard.writeText(el.value).then(()=>{const b=document.querySelector('[data-copy="'+id+'"]');if(b){b.textContent='Copied!';setTimeout(()=>b.textContent='Copy link',1800)}}).catch(()=>{el.select();document.execCommand('copy')})}</script></body></html>
